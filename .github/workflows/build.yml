name: Build SNAPPY

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SNAPPY.csproj

      - name: Build
        run: dotnet build SNAPPY.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish SNAPPY.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: SNAPPY-win-x64
          path: publish/
