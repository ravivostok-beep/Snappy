name: Build SNAPPY

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        shell: pwsh
        run: |
          Write-Host "===== Repository Structure ====="
          Get-ChildItem -Path . -Recurse -File |
            Select-Object FullName

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find Project File
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path . -Recurse -Filter "*.csproj")

          if ($projects.Count -eq 0) {
              Write-Error "No .csproj file was found in the repository."
              exit 1
          }

          Write-Host "Found project:"
          $projects | ForEach-Object {
              Write-Host $_.FullName
          }

          $project = $projects[0].FullName

          "PROJECT_PATH=$project" >> $env:GITHUB_ENV

          Write-Host "Using project:"
          Write-Host $project

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_PATH"

      - name: Build
        shell: pwsh
        run: |
          dotnet build "$env:PROJECT_PATH" `
            --configuration Release `
            --no-restore

      - name: Publish SNAPPY
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "publish/SNAPPY" | Out-Null

          dotnet publish "$env:PROJECT_PATH" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "publish/SNAPPY"

      - name: Upload SNAPPY EXE
        uses: actions/upload-artifact@v4
        with:
          name: SNAPPY-Windows-x64
          path: publish/SNAPPY
