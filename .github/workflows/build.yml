name: SNAPPY Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SNAPPY.csproj

      - name: Build
        run: dotnet build SNAPPY.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish SNAPPY.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SNAPPY-win-x64
          path: publish/
